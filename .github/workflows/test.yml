name: test
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: aube ci
      - run: aube --dir web run build
      - run: aube run test

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: aube ci
      - run: mise run types:check
      # Online checks run in CI only; locally: JACTIONLINT_ONLINE=1 hk check --all
      - run: hk check
        env:
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
