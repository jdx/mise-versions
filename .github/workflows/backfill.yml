name: backfill
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script to run (e.g., backfill-created-at.js)"
        required: true
        type: choice
        options:
          - backfill-created-at.js
      tool:
        description: "Specific tool to process (leave empty for all)"
        required: false
        type: string
      dry_run:
        description: "Dry run (don't write changes)"
        required: false
        type: boolean
        default: false
      debug:
        description: "Enable debug mode (MISE_DEBUG=1)"
        required: false
        type: boolean
        default: false

concurrency:
  group: backfill-${{ github.event.inputs.script }}
  cancel-in-progress: true

permissions: {}

env:
  GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  TOKEN_MANAGER_URL: https://mise-versions.jdx.dev
  TOKEN_MANAGER_SECRET: ${{ secrets.TOKEN_MANAGER_SECRET }}
  # Backfill must read from upstream, not from mise-versions itself —
  # the whole point is to repair entries the host has wrong/stale.
  MISE_USE_VERSIONS_HOST: "false"

jobs:
  backfill:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - run: aube ci

      - run: mise --version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clear mise cache
        run: mise cache clear

      - name: Run backfill script
        env:
          INPUT_SCRIPT: ${{ github.event.inputs.script }}
          INPUT_TOOL: ${{ github.event.inputs.tool }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_DEBUG: ${{ github.event.inputs.debug }}
        run: |
          args=()
          if [ -n "$INPUT_TOOL" ]; then
            args+=("--tool=$INPUT_TOOL")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$INPUT_DEBUG" = "true" ]; then
            args+=(--debug)
          fi
          node "scripts/$INPUT_SCRIPT" "${args[@]}"

      - name: Push any remaining changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git add -A docs/*.toml
          if git diff --cached --quiet; then
            echo "No uncommitted changes"
          else
            git commit -m "chore: backfill data via ${{ github.event.inputs.script }} (cleanup)"
            git push
          fi
