name: aube-lock

# Regenerates aube-lock.yaml on Renovate branches. Renovate's npm manager
# updates package.json but has no aube support, leaving the lockfile stale
# and breaking `aube install --frozen-lockfile` in CI. See
# jdx/renovate-config for the workflow implementation.

on:
  push:
    branches: ["renovate/**"]

# "-caller" keeps this group apart from the one the shared workflow sets for
# its own job (aube-lock-<ref>); equal groups would cancel the called job.
concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  aube-lock:
    permissions:
      contents: write
    uses: jdx/renovate-config/.github/workflows/aube-lock.yml@f29cd6d5584e3acad48f18cc6eba09604a5bc6bf # v1.2.0
    with:
      post_update_task: types
      post_update_paths: |
        worker-configuration.d.ts
    secrets:
      AUBE_LOCK_APP_ID: ${{ secrets.AUBE_LOCK_APP_ID }}
      AUBE_LOCK_APP_PRIVATE_KEY: ${{ secrets.AUBE_LOCK_APP_PRIVATE_KEY }}
