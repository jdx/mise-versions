name: python-precompiled
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: python-precompiled
  cancel-in-progress: true

permissions: {}

env:
  GITHUB_API_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
  DRY_RUN: 0
jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: aube ci
      - run: ./scripts/python.sh
      - name: Upload .gz files to R2
        run: ./scripts/upload-gz.sh
        env:
          API_URL: https://mise-versions.jdx.dev
          API_SECRET: ${{ secrets.TOKEN_MANAGER_SECRET }}

  deploy:
    needs: update
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
      TOKEN_MANAGER_SECRET: ${{ secrets.TOKEN_MANAGER_SECRET }}
      PYTHON_PRECOMPILED_R2_ACCESS_KEY_ID: ${{ secrets.PYTHON_PRECOMPILED_R2_ACCESS_KEY_ID }}
      PYTHON_PRECOMPILED_R2_SECRET_ACCESS_KEY: ${{ secrets.PYTHON_PRECOMPILED_R2_SECRET_ACCESS_KEY }}
