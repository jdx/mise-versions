name: maintenance

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Maintenance task to run"
        required: false
        default: refresh-all
        type: choice
        options:
          - status
          - refresh-rollups
          - refresh-mau
          - refresh-version-stats
          - refresh-summaries
          - refresh-logpush
          - refresh-all
          - legacy-fold
          - legacy-verify
          - legacy-drop
          - legacy-drop-allow-cutover-gaps
      date:
        description: "Newest UTC day to refresh (YYYY-MM-DD); defaults to yesterday, and is clamped to yesterday because the current day is still open"
        required: false
        type: string
      days:
        description: "Number of days to refresh, counting backward from date"
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.event.inputs.task || 'refresh-all' }}
  cancel-in-progress: false

jobs:
  maintenance:
    # Download rollups add the Logpush beacon installs from
    # vars.LOGPUSH_CUTOVER_DATE on, so they run after the Logpush job; a failed
    # or skipped Logpush job still lets every other step run.
    needs: logpush
    if: ${{ !cancelled() }}
    # Shares the Logpush job's group so a manual refresh-rollups (which has no
    # logpush job to wait for) cannot read logpush_daily_* while a scheduled
    # Logpush run is rewriting them.
    concurrency:
      group: maintenance-logpush
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The one-time legacy table retirement scans and deletes millions of rows.
    timeout-minutes: ${{ startsWith(github.event.inputs.task || '', 'legacy-') && 120 || 30 }}
    env:
      TASK: ${{ github.event_name == 'schedule' && 'refresh-all' || github.event.inputs.task || 'refresh-all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Maintenance status
        if: env.TASK == 'status'
        run: node scripts/maintenance-status-direct.js
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Refresh MAU directly
        id: refresh_mau
        if: env.TASK == 'refresh-mau' || env.TASK == 'refresh-all'
        continue-on-error: ${{ env.TASK == 'refresh-all' }}
        run: |
          args=(--days="${INPUT_DAYS:-2}")
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date="$INPUT_DATE")
          fi
          node scripts/refresh-mau-direct.js "${args[@]}"
        env:
          INPUT_DAYS: ${{ github.event.inputs.days }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANALYTICS_ENGINE_ACCOUNT_ID: ${{ secrets.ANALYTICS_ENGINE_ACCOUNT_ID }}
          ANALYTICS_ENGINE_API_TOKEN: ${{ secrets.ANALYTICS_ENGINE_API_TOKEN }}
          ANALYTICS_ENGINE_DATASET: mise_analytics_events
          ANALYTICS_ENGINE_CUTOVER_DATE: "2026-06-12"

      - name: Refresh download rollups directly
        id: refresh_rollups
        if: env.TASK == 'refresh-rollups' || env.TASK == 'refresh-all'
        continue-on-error: ${{ env.TASK == 'refresh-all' }}
        run: |
          args=(--days="${INPUT_DAYS:-2}")
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date="$INPUT_DATE")
          fi
          node scripts/refresh-download-rollups-direct.js "${args[@]}"
        env:
          INPUT_DAYS: ${{ github.event.inputs.days }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          # First UTC day whose installs include the static /t beacon counted
          # from Logpush; unset keeps Analytics Engine-only rollups.
          LOGPUSH_CUTOVER_DATE: ${{ vars.LOGPUSH_CUTOVER_DATE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANALYTICS_ENGINE_ACCOUNT_ID: ${{ secrets.ANALYTICS_ENGINE_ACCOUNT_ID }}
          ANALYTICS_ENGINE_API_TOKEN: ${{ secrets.ANALYTICS_ENGINE_API_TOKEN }}
          ANALYTICS_ENGINE_DATASET: mise_analytics_events
          ANALYTICS_ENGINE_CUTOVER_DATE: "2026-06-12"

      # Summaries are derived from the daily rollups, so only rebuild them
      # once the rollup refresh has fully succeeded.
      - name: Refresh download summaries directly
        id: refresh_summaries
        if: env.TASK == 'refresh-summaries' || (env.TASK == 'refresh-all' && steps.refresh_rollups.outcome == 'success')
        continue-on-error: ${{ env.TASK == 'refresh-all' }}
        run: node scripts/refresh-download-summaries-direct.js
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # version_request events are no longer written (the legacy TOML routes
      # stopped tracking; Logpush counts those clients), so this only rebuilds
      # history on demand and is not part of refresh-all.
      - name: Refresh version stats directly
        if: env.TASK == 'refresh-version-stats'
        run: |
          args=(--days="${INPUT_DAYS:-31}")
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date="$INPUT_DATE")
          fi
          node scripts/refresh-version-stats-direct.js "${args[@]}"
        env:
          INPUT_DAYS: ${{ github.event.inputs.days }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANALYTICS_ENGINE_ACCOUNT_ID: ${{ secrets.ANALYTICS_ENGINE_ACCOUNT_ID }}
          ANALYTICS_ENGINE_API_TOKEN: ${{ secrets.ANALYTICS_ENGINE_API_TOKEN }}
          ANALYTICS_ENGINE_DATASET: mise_analytics_events
          ANALYTICS_ENGINE_CUTOVER_DATE: "2026-06-12"

      # One-time retirement of the pre-Analytics Engine raw download tables:
      # legacy-fold, then legacy-verify, then (after the code that no longer
      # reads them is deployed) legacy-drop, which re-verifies before deleting.
      - name: Retire legacy download tables
        if: startsWith(env.TASK, 'legacy-')
        run: |
          case "$TASK" in
            legacy-drop-allow-cutover-gaps) args=(--mode=drop --allow-cutover-gaps) ;;
            *) args=(--mode="${TASK#legacy-}") ;;
          esac
          node scripts/retire-legacy-downloads-direct.js "${args[@]}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANALYTICS_ENGINE_CUTOVER_DATE: "2026-06-12"

      - name: Fail if required refreshes failed
        if: env.TASK == 'refresh-all' && (steps.refresh_mau.outcome == 'failure' || steps.refresh_rollups.outcome == 'failure' || steps.refresh_summaries.outcome == 'failure')
        run: exit 1

  # Rollups from Cloudflare Logpush http_requests logs in R2. They count mise
  # clients that only hit static assets: the site reads logpush_daily_dau/_mau
  # for DAU/MAU, and the download rollups above add the logpush_daily_* beacon
  # installs from vars.LOGPUSH_CUTOVER_DATE on.
  logpush:
    if: (github.event_name == 'schedule' || github.event.inputs.task == 'refresh-logpush' || github.event.inputs.task == 'refresh-all' || github.event.inputs.task == '')
    # One Logpush rollup at a time across every entry point (schedule,
    # refresh-all, refresh-logpush): each day's tables are cleared and refilled
    # in separate requests, so overlapping runs could interleave.
    concurrency:
      group: maintenance-logpush
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Keep LOGPUSH_TIMEOUT_MINUTES below in sync: timeout-minutes cannot read env.
    timeout-minutes: 90
    # Capacity warnings (scripts/lib/logpush-capacity.js). The rollup prints a
    # `capacity: {...}` line and a step summary table every run; when a
    # threshold is crossed it adds a ::warning:: annotation and emails
    # CAPACITY_ALERT_TO (default: the daily digest's DIGEST_TO), at most once
    # per day. Warnings never fail the job. Tune with these env values:
    #   LOGPUSH_CAPACITY_RUNTIME_RATIO  share of the job timeout (default 0.5)
    #   LOGPUSH_CAPACITY_RSS_RATIO      share of the heap limit for peak RSS (default 0.5)
    #   LOGPUSH_CAPACITY_MAX_DAY_LINES  log lines in one day (default 100000000, ~3x Oct 2026)
    env:
      LOGPUSH_TIMEOUT_MINUTES: "90"
      # Node's --max-old-space-size, in MB; also the memory check's limit.
      LOGPUSH_HEAP_LIMIT_MB: "6144"
    steps:
      # Measure runtime from the start of the job, setup included.
      - name: Record job start
        run: echo "LOGPUSH_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Refresh Logpush shadow analytics
        run: |
          args=(--days="${INPUT_DAYS:-2}")
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date="$INPUT_DATE")
          fi
          node --max-old-space-size="$LOGPUSH_HEAP_LIMIT_MB" scripts/refresh-logpush-analytics-direct.js "${args[@]}"
        env:
          INPUT_DAYS: ${{ github.event.inputs.days }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LOGPUSH_R2_ACCESS_KEY_ID: ${{ secrets.LOGPUSH_R2_ACCESS_KEY_ID }}
          LOGPUSH_R2_SECRET_ACCESS_KEY: ${{ secrets.LOGPUSH_R2_SECRET_ACCESS_KEY }}
          # The Worker's API_SECRET, which keys the IP hashes in Analytics Engine.
          IP_HASH_SECRET: ${{ secrets.TOKEN_MANAGER_SECRET }}
          # Reports requests for baked /data/github/ lists back to the Worker.
          API_SECRET: ${{ secrets.TOKEN_MANAGER_SECRET }}
          LOGPUSH_ZONES: jdx.dev
          # Capacity alert email, sent like the daily digest.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CAPACITY_ALERT_TO: ${{ vars.CAPACITY_ALERT_TO }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          DIGEST_FROM: ${{ vars.DIGEST_FROM }}
