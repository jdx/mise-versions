name: deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/*.toml"
      - "web/**"
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - "aube-lock.yaml"
      - ".config/aube/config.toml"
      - ".github/workflows/deploy.yml"
  # Called by the python-precompiled workflow once it has uploaded new .gz
  # lists to R2 (its docs commit triggers a push deploy before the upload), so
  # the static /data/*.gz copies pick up the uploaded bytes.
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      RESEND_API_KEY:
        required: false
      MISE_GITHUB_TOKEN:
        required: true
      TOKEN_MANAGER_SECRET:
        required: true
      PYTHON_PRECOMPILED_R2_ACCESS_KEY_ID:
        required: false
      PYTHON_PRECOMPILED_R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

# Queue rather than cancel: a deploy in progress finishes, and of the deploys
# dispatched meanwhile (catalog updates, the GitHub version-list refresher)
# only the newest waits, so a burst still produces one more deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # When python-precompiled calls this workflow, its own sha predates
          # the docs commits pushed since (including its own), so deploy the
          # current main rather than rolling the version files back.
          ref: ${{ github.workflow != 'deploy' && 'main' || '' }}

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: aube ci

      - name: Build web frontend
        run: aube --dir web run build

      # Serve /data/python-precompiled*.gz as static assets (no Worker
      # invocation), byte-identical to the R2 objects behind /tools/*.gz. Read
      # from R2 directly: the Worker route's responses are edge-cached.
      - name: Copy python-precompiled lists into static assets
        run: node scripts/fetch-python-precompiled-assets.js web/dist/client/data
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHON_PRECOMPILED_R2_ACCESS_KEY_ID: ${{ secrets.PYTHON_PRECOMPILED_R2_ACCESS_KEY_ID }}
          PYTHON_PRECOMPILED_R2_SECRET_ACCESS_KEY: ${{ secrets.PYTHON_PRECOMPILED_R2_SECRET_ACCESS_KEY }}

      # Serve the GitHub version lists clients have asked for as static
      # assets under /data/github/ (no Worker invocation). The Worker's
      # refresher keeps them fresh in KV; the bake copies only the lists
      # changed since the cached tree's bake, and every list without a cache.
      # No GitHub requests. Never fails the deploy: a list that is not baked
      # is answered by the Worker.
      - name: Restore baked GitHub version lists
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/github-versions
          key: github-versions-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: github-versions-

      - name: Bake GitHub version lists into static assets
        run: node scripts/bake-github-versions.js web/dist/client
        env:
          API_SECRET: ${{ secrets.TOKEN_MANAGER_SECRET }}

      - name: Save baked GitHub version lists
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/github-versions
          key: github-versions-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to Cloudflare Workers
        run: |
          for attempt in 1 2 3; do
            if aube exec wrangler deploy; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Cloudflare deployment failed after $attempt attempts"
              exit 1
            fi

            delay=$((attempt * 15))
            echo "::warning::Cloudflare deployment attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Only now are the baked lists live: tell the Worker, so its refresher
      # dispatches deploys only for changes after them.
      - name: Acknowledge baked GitHub version lists
        run: node scripts/bake-github-versions.js --ack
        env:
          API_SECRET: ${{ secrets.TOKEN_MANAGER_SECRET }}

      - name: Configure Resend alert secret
        run: |
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::warning::RESEND_API_KEY is not configured; preserving the existing Worker secret"
            exit 0
          fi
          printf '%s' "$RESEND_API_KEY" | aube exec wrangler secret put RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure GitHub Actions dispatcher secret
        run: |
          if [ -z "${GITHUB_ACTIONS_TOKEN:-}" ]; then
            echo "::error::MISE_GITHUB_TOKEN is required for the Cloudflare update scheduler"
            exit 1
          fi
          printf '%s' "$GITHUB_ACTIONS_TOKEN" | aube exec wrangler secret put GITHUB_ACTIONS_TOKEN
        env:
          GITHUB_ACTIONS_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run database migrations
        run: node scripts/migrate.js run
        env:
          TOKEN_MANAGER_URL: https://mise-versions.jdx.dev
          TOKEN_MANAGER_SECRET: ${{ secrets.TOKEN_MANAGER_SECRET }}
