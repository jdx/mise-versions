# cache-break: 2025-12-15
tasks.build = "aube exec tsc"
tasks.dev = "aube exec wrangler dev"
tasks.lint = "aube exec eslint . --ext .ts && aube exec prettier --check ."
tasks."lint:fix" = "aube exec eslint . --ext .ts --fix && aube exec prettier --write ."
tasks.types = "aube exec wrangler types --env-file .env.example"
tasks."types:check" = "aube exec wrangler types --env-file .env.example --check"

tasks.gen.run = [
  "aube dlx supabase gen types typescript --project-id fjrwmlxwmhtzflckukna > ./src/database.types.ts",
  "aube exec prettier --write ./src/database.types.ts"
]

[tasks.deploy]
depends = ["build"]
run = "aube exec wrangler deploy"

[tools]
sd = "latest"
aube = { version = "latest", minimum_release_age = "0s" }
fd = "latest"
s5cmd = "latest"
hk = { version = "latest", minimum_release_age = "0s" }
node = "24"
shellcheck = "latest"
shfmt = "latest"
uv = "latest"
wait-for-gh-rate-limit = { version = "latest", minimum_release_age = "0s" }
yq = "latest"

[env]
_.path = ["./node_modules/.bin"]
